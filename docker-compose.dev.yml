# =============================================================================
# Local development overrides. Compose MERGES this file on top of
# docker-compose.yml when you pass both with -f:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Ports bind to 127.0.0.1 only, so nothing is reachable from your Wi-Fi network.
# =============================================================================
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432" # for a DB GUI (DBeaver, pgAdmin, VS Code)

  n8n:
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      # Allow the login cookie over plain http://localhost
      N8N_SECURE_COOKIE: "false"

  screener-api:
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: dev
      # File-change events don't cross from Windows into containers reliably,
      # so make uvicorn's reloader poll for changes instead
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      # Mount your source code so edits show up without a rebuild
      - ./screener-api/app:/code/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/code/app", "--no-access-log"]

  # ---------------------------------------------------------------------------
  # Public HTTPS for local testing (Vapi, Meta and phones must reach your PC).
  # Opt-in:  docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile tunnel up -d
  # Then:    .\screener-api\.venv\Scripts\python.exe scripts\dev_tunnel.py   (updates .env + Vapi)
  # Cloudflare "quick tunnel": no account needed, but the URL changes every time the
  # tunnel container restarts - leave it running while you test.
  # ---------------------------------------------------------------------------
  caddy-dev:
    image: caddy:2.11.7-alpine
    profiles: ["tunnel"]
    restart: unless-stopped
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      - screener-api
      - n8n

  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://caddy-dev:8080"]
    depends_on:
      - caddy-dev
