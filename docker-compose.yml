# =============================================================================
# AI Internship Screener - base Docker Compose stack (used in dev AND prod)
#
#   Local dev : docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#   Production: docker compose --profile prod up -d        (adds Caddy, Phase 6)
#
# Key ideas:
# - Every service joins the same private network, so containers reach each
#   other by service name (e.g. the API connects to "postgres:5432").
# - Nothing is published to the host here. The dev override opens ports on
#   127.0.0.1; in prod only Caddy (80/443) is public.
# - ${VAR:?msg} makes Compose refuse to start if a required variable is
#   missing from .env -> fail fast instead of running with empty secrets.
# - healthchecks + depends_on(condition: service_healthy) give a clean
#   start order: postgres -> n8n / screener-api.
# =============================================================================
name: ai-screener

services:
  # ---------------------------------------------------------------------------
  # Postgres 16: one server, two databases (see postgres/init/):
  #   n8n       -> n8n's own data (workflows, credentials, executions)
  #   screener  -> LangGraph checkpoints + evaluation audit log
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      # Read only by postgres/init/01-create-dbs.sh on FIRST start (empty volume)
      N8N_DB_NAME: ${N8N_DB_NAME:-n8n}
      N8N_DB_USER: ${N8N_DB_USER:-n8n}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
      SCREENER_DB_NAME: ${SCREENER_DB_NAME:-screener}
      SCREENER_DB_USER: ${SCREENER_DB_USER:-screener}
      SCREENER_DB_PASSWORD: ${SCREENER_DB_PASSWORD:?Set SCREENER_DB_PASSWORD in .env}
      TZ: ${TZ:-Asia/Karachi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # n8n: workflow automation (WhatsApp, Sheets, Calendar, Gmail, webhooks)
  # ---------------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.42.6}
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
      # Encrypts the credentials you save in n8n. NEVER change it after first
      # start, or n8n can no longer decrypt saved credentials.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_PORT: 5678
      # Public base URL n8n shows for webhook nodes (tunnel URL locally, domain in prod)
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      # Where the editor lives. Also the base of OAuth callbacks ("Sign in with Google"),
      # which must stay on localhost in dev (the tunnel doesn't expose the editor / REST API).
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TZ:-Asia/Karachi}
      TZ: ${TZ:-Asia/Karachi}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Keep the execution history from growing forever
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336 # hours (14 days)
      # Workflows call our API by its service name on the internal network
      SCREENER_API_URL: http://screener-api:8000
      SCREENER_API_KEY: ${SCREENER_API_KEY:?Set SCREENER_API_KEY in .env}
      # Allow {{ $env.SCREENER_API_KEY }} inside workflow expressions
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Used by the workflows (n8n/workflows, built by scripts/n8n_workflows.py)
      VAPI_WEBHOOK_SECRET: ${VAPI_WEBHOOK_SECRET:-}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
      META_WA_ACCESS_TOKEN: ${META_WA_ACCESS_TOKEN:-}
      META_WA_PHONE_NUMBER_ID: ${META_WA_PHONE_NUMBER_ID:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v24.0}
      WA_TEMPLATE_LANG: ${WA_TEMPLATE_LANG:-en}
      HR_WHATSAPP_NUMBER: ${HR_WHATSAPP_NUMBER:-}
      HR_EMAIL: ${HR_EMAIL:-}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The n8n image always has node, so use it instead of curl/wget
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------------------
  # screener-api: FastAPI + LangGraph "Screening Decision Agent"
  # ---------------------------------------------------------------------------
  screener-api:
    build:
      context: ./screener-api
    image: ${SCREENER_API_IMAGE:-ai-screener/screener-api:local}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-Asia/Karachi}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      SCREENER_API_KEY: ${SCREENER_API_KEY:?Set SCREENER_API_KEY in .env}
      DB_HOST: postgres
      DB_PORT: 5432
      SCREENER_DB_NAME: ${SCREENER_DB_NAME:-screener}
      SCREENER_DB_USER: ${SCREENER_DB_USER:-screener}
      SCREENER_DB_PASSWORD: ${SCREENER_DB_PASSWORD:?Set SCREENER_DB_PASSWORD in .env}
      # LLM (Phase 2). Only the key for the chosen provider is needed.
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Voice interview (Phase 3). The PUBLIC key is shown in the browser. The PRIVATE key
      # stays server-side: only used to fetch call recordings for HR (never sent to browsers).
      VAPI_PUBLIC_KEY: ${VAPI_PUBLIC_KEY:-}
      VAPI_ASSISTANT_ID: ${VAPI_ASSISTANT_ID:-}
      VAPI_PRIVATE_KEY: ${VAPI_PRIVATE_KEY:-}
      COMPANY_NAME: ${COMPANY_NAME:-Our Company}
      INTERNSHIP_DURATION: ${INTERNSHIP_DURATION:-three months}
      INTERNSHIP_SCHEDULE: ${INTERNSHIP_SCHEDULE:-full-time, Monday to Friday}
      INTERNSHIP_START: ${INTERNSHIP_START:-next month}
      INTERNSHIP_FAQ: ${INTERNSHIP_FAQ:-}
      # WhatsApp webhook (Phase 5): signature check + who may APPROVE/REJECT
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      HR_WHATSAPP_NUMBER: ${HR_WHATSAPP_NUMBER:-}
      # Google Calendar (Phase 4): token file comes from the ./secrets mount below
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      GOOGLE_TOKEN_FILE: /run/secrets/google-token.json
      CALENDAR_INVITE_CANDIDATE: ${CALENDAR_INVITE_CANDIDATE:-true}
      # LangSmith tracing (optional): LangChain reads these automatically
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-ai-internship-screener}
    volumes:
      # Git-ignored folder with secret files (Google token). Read-only inside the container.
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Caddy: HTTPS reverse proxy. Only runs with `--profile prod` (Phase 6).
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      n8n:
        condition: service_healthy
      screener-api:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:
